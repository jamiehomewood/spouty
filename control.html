<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Spouty</title>
<style>
  :root { --bg:#1b1d22; --panel:#24272e; --line:#343842; --text:#e8e9ec; --dim:#9aa0ab;
          --ok:#3fbf6f; --warn:#e0a83a; --bad:#e05a4f; --accent:#5b8def; }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; background:var(--bg); color:var(--text);
         font:13px/1.4 "Segoe UI", system-ui, sans-serif; user-select:none; }
  h1 { font-size:15px; margin:0 0 10px; font-weight:600; }
  .status { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
            border-radius:8px; padding:10px 12px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--bad); flex:none; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); }
  .status b { font-weight:600; }
  .err { color:var(--bad); margin:6px 2px 0; min-height:1em; font-size:12px; }
  fieldset { min-width:0; border:1px solid var(--line); border-radius:8px; margin:12px 0 0; padding:8px 12px 12px; }
  legend { color:var(--dim); padding:0 4px; font-size:12px; }
  label { display:block; color:var(--dim); font-size:12px; margin:8px 0 3px; }
  textarea#url { resize:none; overflow:hidden; line-height:1.35; overflow-wrap:anywhere; display:block; }
  .row > div, .row > textarea { min-width:0; }
  input[type=text], input[type=number], select, textarea#url {
    width:100%; background:#15171b; color:var(--text); border:1px solid var(--line); border-radius:5px;
    padding:6px 8px; font:inherit; user-select:text; }
  .row { display:flex; gap:8px; align-items:end; }
  .row.top { align-items:start; } .row > * { flex:1; }
  .row > button { flex:none; }
  button { background:#323743; color:var(--text); border:1px solid var(--line); border-radius:5px;
           padding:6px 11px; font:inherit; cursor:pointer; }
  button:hover { background:#3b4150; } button.primary { background:var(--accent); border-color:var(--accent); }
  .keys { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; }
  .keys button { padding:8px 4px; }
  .keys kbd { display:block; color:var(--dim); font:11px ui-monospace, Consolas, monospace; }
  .check { display:flex; align-items:center; gap:6px; color:var(--text); font-size:13px; margin-top:10px; }
  .hint { color:var(--dim); font-size:11.5px; margin-top:6px; }
  .showing { color:var(--dim); font-size:11.5px; margin-top:5px; overflow-wrap:anywhere; }
  .showing span { color:var(--text); }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .pending, .pending:focus { border-color:var(--warn) !important; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; margin-top:12px; }
  .foot { display:flex; justify-content:space-between; margin-top:12px; }
</style>
</head>
<body>
<h1>Spouty</h1>

<div class="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
<div class="err" id="err"></div>

<fieldset>
  <legend>Scene</legend>
  <label for="url">Page URL</label>
  <div class="row top"><textarea id="url" rows="1" spellcheck="false" wrap="soft"></textarea><button id="load" class="primary" title="Load the URL in the box (or reload it, e.g. after editing dialogue.json)">Load</button></div>
  <div class="showing">Showing: <span id="showing">–</span></div>

  <div class="keys" id="keys">
    <button data-key=" ">Start<kbd>Space</kbd></button>
    <button data-key="y">Yes<kbd>Y</kbd></button>
    <button data-key="n">No<kbd>N</kbd></button>
    <button data-key="s">Stop<kbd>S</kbd></button>
    <button data-key="r">Replay<kbd>R</kbd></button>
    <button data-key="t">New take<kbd>T</kbd></button>
    <button data-key="h">Status<kbd>H</kbd></button>
    <button id="click" title="Clicks the middle of the scene">Click<kbd>scene</kbd></button>
  </div>
  <div class="hint">Keys you press while this window is in front also go to the scene.</div>
</fieldset>

<fieldset>
  <legend>Output</legend>
  <div class="row">
    <div><label for="senderName">Spout sender name</label><input type="text" id="senderName" spellcheck="false"></div>
  </div>
  <div class="row">
    <div><label for="width">Width</label><input type="number" id="width" min="64" step="1"></div>
    <div><label for="height">Height</label><input type="number" id="height" min="64" step="1"></div>
    <div><label for="fps">Max fps</label><input type="number" id="fps" min="1" max="240" step="1"></div>
  </div>
  <label for="audio">Audio output</label>
  <select id="audio"></select>
  <label class="check"><input type="checkbox" id="muted"> Mute</label>
</fieldset>

<details>
  <summary>Advanced</summary>
  <label class="check"><input type="checkbox" id="gpu"> GPU zero-copy mode (try if the frame rate is low)</label>
  <div class="hint" id="cfgPath"></div>
  <div class="foot"><button id="devtools">Scene dev tools</button></div>
</details>

<script>
const $ = id => document.getElementById(id);
let cfg = {};

async function listOutputs(selected) {
  const sel = $('audio');
  let devices = [];
  try { devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audiooutput'); } catch {}
  sel.innerHTML = '';
  const add = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; sel.appendChild(o); };
  add('', 'Windows default');
  const seen = new Set();
  for (const d of devices) {
    if (!d.label || d.deviceId === 'default' || d.deviceId === 'communications' || seen.has(d.label)) continue;
    seen.add(d.label); add(d.label, d.label);
  }
  if (selected && !seen.has(selected)) add(selected, selected + ' (not found)');
  sel.value = selected || '';
}

function fill() {
  for (const k of ['url', 'senderName', 'width', 'height', 'fps']) {
    if (document.activeElement !== $(k) || k === 'url') $(k).value = cfg[k];
  }
  $('url').classList.remove('pending');
  fitUrl();
  $('muted').checked = !!cfg.muted;
  $('gpu').checked = !!cfg.gpuSharedTexture;
}

async function set(changes) { cfg = await window.sender.setConfig(changes); fill(); }

(async () => {
  const r = await window.sender.getConfig();
  cfg = r.cfg; fill();
  $('cfgPath').textContent = 'Settings are saved in ' + r.configPath;
  await listOutputs(cfg.audioOutput);
})();
navigator.mediaDevices.addEventListener('devicechange', () => listOutputs($('audio').value));

// URL: Load button or Enter loads it; an orange box means typed but not loaded yet
const urlEl = $('url');
const loadTyped = async () => { cfg = await window.sender.loadUrl(urlEl.value); fill(); };
$('load').addEventListener('click', loadTyped);
urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); loadTyped(); } });
// the URL box grows to fit, so long URLs wrap instead of running off the window
function fitUrl() { const u = $('url'); u.style.height = 'auto'; u.style.height = u.scrollHeight + 2 + 'px'; }
urlEl.addEventListener('input', () => { urlEl.value = urlEl.value.replace(/[\r\n]+/g, ''); fitUrl();
  urlEl.classList.toggle('pending', urlEl.value.trim() !== cfg.url); });
addEventListener('resize', fitUrl);

// other text fields apply on Enter or when you leave them
for (const k of ['senderName', 'width', 'height', 'fps']) {
  const el = $(k);
  const apply = () => { const v = el.type === 'number' ? Number(el.value) : el.value.trim(); if (v !== cfg[k]) set({ [k]: v }); };
  el.addEventListener('change', apply);
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { el.blur(); } });
}
$('audio').addEventListener('change', e => set({ audioOutput: e.target.value }));
$('muted').addEventListener('change', e => set({ muted: e.target.checked }));
$('gpu').addEventListener('change', e => set({ gpuSharedTexture: e.target.checked }));
$('devtools').addEventListener('click', () => window.sender.devtools());
$('click').addEventListener('click', () => window.sender.click());
for (const b of document.querySelectorAll('[data-key]')) {
  b.addEventListener('click', () => window.sender.key(b.dataset.key));
}

// keyboard pass-through when not typing in a field
const PASS = new Set([' ', 'Enter', 'y', 'n', 'r', 't', 's', 'h']);
addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (PASS.has(k)) { e.preventDefault(); window.sender.key(k); }
});

window.sender.onConfig(c => { cfg = c; fill(); });   // e.g. config.json edited by hand

window.sender.onStatus(s => {
  $('showing').textContent = s.showing || '–';
  $('showing').title = s.showing || '';
  const dot = $('dot');
  if (s.sending) {
    dot.className = 'dot ' + (s.fps >= 50 ? 'ok' : s.fps >= 25 ? 'warn' : 'warn');
    $('statusText').innerHTML = `Sending as <b></b> · ${cfg.width} × ${cfg.height} · ${s.fps} fps`;
    $('statusText').querySelector('b').textContent = cfg.senderName;
  } else if (s.spoutReady) {
    dot.className = 'dot warn';
    $('statusText').textContent = 'Spout ready, waiting for frames from the page…';
  } else {
    dot.className = 'dot';
    $('statusText').textContent = 'Not sending';
  }
  $('err').textContent = s.error || '';
});
</script>
</body>
</html>
